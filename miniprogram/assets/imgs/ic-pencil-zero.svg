  <rect x="23.5" y="12" width="2.5" height="30" rx="1" fill="#fff" opacity="0.35"/>
  <!-- Pencil tip -->
  <polygon points="23,44 33,44 28,54" fill="#FFE0B2" stroke="#E8A830" stroke-width="0.5"/>
  <!-- Left booster / ribbon -->
  <path d="M10 26 L16 42 L14 52 L8 38 Z" fill="#E85D4E" stroke="#C0392B" stroke-width="0.5"/>
  <!-- Right booster / ribbon -->
